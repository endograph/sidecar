name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # Trusted publishing: npm exchanges this job's OIDC token for a one-time
    # publish credential, so no npm token is stored anywhere. The publisher
    # is registered on npmjs.com for exactly this repo and workflow file —
    # renaming this file breaks publishing until the registration is updated.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # A tag that disagrees with the manifest would publish the wrong number,
      # and a version can never be re-published.
      - name: Check tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./packages/sidecar/package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match package version $version" >&2
            exit 1
          fi

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      # prepack builds dist and copies README/LICENSE; prepublishOnly typechecks.
      - name: Publish
        working-directory: packages/sidecar
        run: npm publish

  release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # Notes are the commit list since the previous tag. Commits land on main
      # directly (no PRs), so GitHub's --generate-notes would come up empty.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prev=$(git describe --abbrev=0 --tags --match 'v*' "$TAG"^ 2>/dev/null || true)
          notes=$(git log --no-merges --format='- %s (%h)' ${prev:+$prev..}"$TAG")
          gh release create "$TAG" --title "$TAG" --notes "$notes"

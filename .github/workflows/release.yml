name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # Notes are the commit list since the previous tag. Commits land on main
      # directly (no PRs), so GitHub's --generate-notes would come up empty.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prev=$(git describe --abbrev=0 --tags --match 'v*' "$TAG"^ 2>/dev/null || true)
          notes=$(git log --no-merges --format='- %s (%h)' ${prev:+$prev..}"$TAG")
          gh release create "$TAG" --title "$TAG" --notes "$notes"
